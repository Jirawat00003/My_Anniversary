<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Anniversary</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="opening">

        <div class="stars">
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>
            <span>✦</span>
            <span>✧</span>
        </div>

        <div class="letter">

            <div class="envelope">

                <div class="envelope-flap"></div>

                <div class="mini-heart"></div>

                <div class="envelope-content">

                    <h1>Happy Anniversary</h1>

                    <p>Every story has a beginning.</p>

                    <p>
                        Ours started on <br>
                        <strong>21 July 2026</strong>
                    </p>

                    <button id="openBtn">
                        OPEN LETTER
                    </button>

                </div>

            </div>

        </div>

    </section>

    <script src="JS/script.js"></script>

</body>

</html>
